<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laufstrecken-Planer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Verhindert Scrollen auf mobilen Geräten */
        }
        
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        /* Das UI-Panel soll über der Karte schweben */
        .ui-panel {
            z-index: 1000;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.95);
        }

        /* Entfernt den blauen Rand beim Antippen auf Mobile */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="relative bg-gray-100">

    <!-- Karten-Container -->
    <div id="map"></div>

    <!-- Schwebendes Dashboard / UI-Panel -->
    <div class="ui-panel absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm rounded-3xl shadow-2xl p-5 border border-gray-200 transition-all">
        <div class="flex items-center space-x-3 mb-4">
            <div class="bg-orange-100 p-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Strecken-Planer</h1>
        </div>
        
        <div class="mb-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Gesamtdistanz</p>
            <div class="flex items-baseline space-x-1">
                <span id="distanceValue" class="text-5xl font-black text-orange-500 tabular-nums tracking-tighter">0.00</span>
                <span class="text-lg font-bold text-gray-400">km</span>
            </div>
            <p class="text-xs text-gray-500 mt-2">Tippe auf die Karte, um Wegpunkte hinzuzufügen.</p>
        </div>

        <button id="clearBtn" class="w-full group relative flex justify-center items-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-orange-600 bg-orange-50 hover:bg-orange-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Route löschen
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Initialisiere die Karte und zentriere sie auf Altdorf, Uri
        const map = L.map('map', {
            zoomControl: false // Wir blenden die Standard-Zoom-Controls aus für einen cleaneren Look
        }).setView([46.8804, 8.6444], 15);

        // Füge die Zoom-Controls unten rechts hinzu
        L.control.zoom({
            position: 'topright'
        }).addTo(map);

        // 2. Lade die Kartenkacheln (OpenStreetMap für detaillierte Gebäude und Straßen)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // State-Variablen für die Route
        let waypoints = []; // Speichert die Koordinaten (LatLng Objekte)
        let markers = [];   // Speichert die visuellen Marker auf der Karte
        
        // Konfiguriere die Polyline (die gezeichnete Linie zwischen den Punkten)
        const routeLine = L.polyline([], {
            color: '#f97316', // Tailwind orange-500
            weight: 5,
            opacity: 0.8,
            lineCap: 'round',
            lineJoin: 'round',
            dashArray: '1, 10' // Leichter gestrichelter Effekt für einen sportlichen Look
        }).addTo(map);

        // DOM Elemente
        const distanceEl = document.getElementById('distanceValue');
        const clearBtn = document.getElementById('clearBtn');

        // Hilfsfunktion zur Formatierung der Zahl
        function formatDistance(meters) {
            return (meters / 1000).toFixed(2);
        }

        // Funktion zur Neuberechnung der Gesamtdistanz
        function updateDistance() {
            let totalMeters = 0;
            if (waypoints.length > 1) {
                for (let i = 0; i < waypoints.length - 1; i++) {
                    // distanceTo ist eine eingebaute Leaflet-Funktion, die Meter zurückgibt
                    totalMeters += waypoints[i].distanceTo(waypoints[i + 1]);
                }
            }
            
            // UI aktualisieren mit kleiner Animation
            distanceEl.style.transform = 'scale(1.1)';
            setTimeout(() => {
                distanceEl.style.transform = 'scale(1)';
            }, 150);
            
            distanceEl.textContent = formatDistance(totalMeters);
        }

        // Event-Listener für Klicks auf die Karte
        map.on('click', function(e) {
            const latlng = e.latlng;
            
            // Punkt zur Liste hinzufügen
            waypoints.push(latlng);
            
            // Marker erstellen (Wir nutzen CircleMarker für einen modernen, sportlichen Look)
            const marker = L.circleMarker(latlng, {
                radius: 6,
                fillColor: '#ffffff',
                color: '#f97316',
                weight: 3,
                opacity: 1,
                fillOpacity: 1
            }).addTo(map);
            
            markers.push(marker);
            
            // Polyline mit den neuen Punkten aktualisieren
            routeLine.setLatLngs(waypoints);
            
            // Distanz neu berechnen und anzeigen
            updateDistance();
        });

        // Event-Listener für den "Route löschen" Button
        clearBtn.addEventListener('click', function() {
            if(waypoints.length === 0) return; // Nichts zu tun
            
            // 1. Alle Marker von der Karte entfernen
            markers.forEach(marker => map.removeLayer(marker));
            
            // 2. Arrays leeren
            markers = [];
            waypoints = [];
            
            // 3. Linie leeren
            routeLine.setLatLngs([]);
            
            // 4. Distanzanzeige zurücksetzen
            updateDistance();
        });
    </script>
</body>
</html>
