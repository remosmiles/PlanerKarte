<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laufstrecken-Planer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Verhindert Scrollen auf mobilen Geräten */
            display: flex;
            flex-direction: row;
        }
        
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
        }
        
        #sidebar {
            width: 350px;
            height: 100vh;
            flex-shrink: 0;
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            #sidebar {
                width: 100%;
                height: auto;
                max-height: 45vh;
                overflow-y: auto;
            }
        }

        #map {
            flex: 1;
            height: 100vh;
            width: 100%;
            z-index: 1;
            position: relative;
        }

        /* Verstecke die Standard Routing Machine Text-Anweisungen */
        .leaflet-routing-container {
            display: none !important;
        }

        /* Entfernt den blauen Rand beim Antippen auf Mobile */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Smoothe Transitions für Text */
        #distanceValue {
            display: inline-block;
            transition: transform 0.15s ease-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Sidebar / Dashboard -->
    <div id="sidebar" class="bg-gray-900 shadow-2xl flex flex-col p-6 border-r border-gray-800">
        <div class="flex items-center space-x-3 mb-8">
            <div class="bg-[#fc4c02]/20 p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-[#fc4c02]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Pro Route Planner</h1>
        </div>
        
        <div class="space-y-6 flex-grow">
            <!-- Distanz -->
            <div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Gesamtdistanz</p>
                <div class="flex items-baseline space-x-1">
                    <span id="distanceValue" class="text-5xl font-black text-white tabular-nums tracking-tighter">0.00</span>
                    <span class="text-xl font-bold text-[#fc4c02]">km</span>
                </div>
            </div>

            <!-- Pace & Dauer -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 transition-colors focus-within:border-[#fc4c02]/50">
                    <label for="paceInput" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Pace (min/km)</label>
                    <input type="text" id="paceInput" value="5:15" class="w-full bg-transparent text-xl font-bold text-white focus:outline-none placeholder-gray-500" placeholder="5:15" />
                </div>
                <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 flex flex-col justify-center">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Dauer</p>
                    <p id="durationValue" class="text-xl font-bold text-white tabular-nums">0m 00s</p>
                </div>
            </div>
            
            <p class="text-sm text-gray-400 mt-4 bg-gray-800/50 p-4 rounded-xl border border-gray-700/50 border-l-4 border-l-[#fc4c02]">
                Tippe auf die Karte, um Wegpunkte hinzuzufügen. Die Route rastet automatisch auf Wegen und Straßen ein.
            </p>
        </div>

        <div class="space-y-3 mt-6">
            <button id="exportBtn" class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-[#fc4c02] hover:bg-[#e04302] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-[#fc4c02] transition-colors shadow-lg shadow-[#fc4c02]/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span>GPX für Garmin exportieren</span>
            </button>
            <button id="clearBtn" class="w-full flex justify-center items-center py-3.5 px-4 border border-gray-700 text-sm font-bold rounded-xl text-gray-300 bg-gray-800 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-gray-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Route löschen
            </button>
        </div>
    </div>

    <!-- Karten-Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <script>
        // 1. Initialisiere die Karte und zentriere sie auf Altdorf, Uri
        const map = L.map('map', {
            zoomControl: false 
        }).setView([46.8804, 8.6444], 15);

        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // State-Variablen
        let currentDistanceKm = 0;
        let routeCoordinates = [];

        // DOM Elemente
        const distanceEl = document.getElementById('distanceValue');
        const durationEl = document.getElementById('durationValue');
        const paceInput = document.getElementById('paceInput');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');

        // 2. Leaflet Routing Machine Setup (übernimmt die Routenberechnung auf Straßen)
        const routingControl = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true,
            lineOptions: {
                styles: [{ color: '#fc4c02', opacity: 0.9, weight: 6, lineCap: 'round', lineJoin: 'round' }]
            },
            showAlternatives: false,
            fitSelectedRoutes: false,
            createMarker: function(i, wp, nWps) {
                // Eigene sportliche Marker: Start = Grün, Ziel = Rot, dazwischen = Weiß
                const isStart = i === 0;
                const isEnd = i === nWps - 1 && nWps > 1;
                return L.circleMarker(wp.latLng, {
                    radius: isStart || isEnd ? 8 : 6,
                    fillColor: isStart ? '#10b981' : (isEnd ? '#ef4444' : '#ffffff'),
                    color: '#fc4c02',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 1
                });
            }
        }).addTo(map);

        // 3. Wegpunkte hinzufügen per Klick auf die Karte
        map.on('click', function(e) {
            const waypoints = routingControl.getWaypoints().filter(wp => wp.latLng).map(wp => wp.latLng);
            waypoints.push(e.latlng);
            routingControl.setWaypoints(waypoints);
        });

        // 4. Distanz extrahieren und UI updaten, sobald die Route gefunden wurde
        routingControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            
            // Distanz in KM umwandeln
            currentDistanceKm = summary.totalDistance / 1000;
            distanceEl.textContent = currentDistanceKm.toFixed(2);
            
            // Koordinaten für den GPX Export speichern
            routeCoordinates = routes[0].coordinates;

            // Kurze UI Animation
            distanceEl.style.transform = 'scale(1.1)';
            setTimeout(() => { distanceEl.style.transform = 'scale(1)'; }, 150);

            updateDuration();
        });

        // 5. Dauer berechnen basierend auf Pace
        function updateDuration() {
            if (currentDistanceKm === 0) {
                durationEl.textContent = "0m 00s";
                return;
            }

            const paceStr = paceInput.value;
            const parts = paceStr.split(':');
            let minsPerKm = 5;
            let secsPerKm = 15;

            // Validiere die Eingabe (z.B. "5:15")
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                minsPerKm = parseInt(parts[0]);
                secsPerKm = parseInt(parts[1]);
            }

            // Dauer mathematisch berechnen
            const totalMinutesPerKm = minsPerKm + (secsPerKm / 60);
            const totalMinutes = currentDistanceKm * totalMinutesPerKm;

            const hrs = Math.floor(totalMinutes / 60);
            const mins = Math.floor(totalMinutes % 60);
            const secs = Math.round((totalMinutes % 1) * 60);

            // In ein schönes Format bringen
            if (hrs > 0) {
                durationEl.textContent = `${hrs}h ${mins.toString().padStart(2, '0')}m ${secs.toString().padStart(2, '0')}s`;
            } else {
                durationEl.textContent = `${mins}m ${secs.toString().padStart(2, '0')}s`;
            }
        }

        // Automatische Update-Auslösung bei Änderung der Pace
        paceInput.addEventListener('input', updateDuration);

        // 6. Route komplett löschen
        clearBtn.addEventListener('click', function() {
            routingControl.setWaypoints([]);
            currentDistanceKm = 0;
            routeCoordinates = [];
            distanceEl.textContent = "0.00";
            durationEl.textContent = "0m 00s";
        });

        // 7. GPX Export Logik
        exportBtn.addEventListener('click', function() {
            if (routeCoordinates.length === 0) {
                // Wenn keine Route da ist, zeigen wir eine kurze Fehler-Animation am Button
                const originalHTML = exportBtn.innerHTML;
                exportBtn.innerHTML = "Keine Route erstellt!";
                exportBtn.classList.replace('bg-[#fc4c02]', 'bg-red-500');
                setTimeout(() => {
                    exportBtn.innerHTML = originalHTML;
                    exportBtn.classList.replace('bg-red-500', 'bg-[#fc4c02]');
                }, 2000);
                return;
            }

            // GPX Format manuell als String zusammensetzen
            let gpx = '<?xml version="1.0" encoding="UTF-8"?>\n';
            gpx += '<gpx version="1.1" creator="Pro Laufstrecken-Planer">\n';
            gpx += '  <trk>\n    <name>Geplante Laufroute</name>\n    <trkseg>\n';
            
            routeCoordinates.forEach(coord => {
                gpx += `      <trkpt lat="${coord.lat}" lon="${coord.lng}"></trkpt>\n`;
            });
            
            gpx += '    </trkseg>\n  </trk>\n</gpx>';

            // Den String in eine Datei umwandeln und den Download auslösen
            const blob = new Blob([gpx], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'meine_laufroute.gpx';
            document.body.appendChild(a);
            a.click();
            
            // Aufräumen
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
